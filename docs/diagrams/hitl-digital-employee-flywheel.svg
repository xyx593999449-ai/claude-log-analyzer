<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" width="1800" height="1200">
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      fill: #1a1a1a;
    }
    .title { font-size: 36px; font-weight: 700; }
    .subtitle { font-size: 17px; fill: #5f5f5f; }
    .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #5a5a5a; }
    .card-title { font-size: 24px; font-weight: 700; }
    .card-body { font-size: 16px; fill: #5f5f5f; }
    .center-title { font-size: 32px; font-weight: 700; }
    .center-body { font-size: 17px; fill: #5f5f5f; }
    .tag { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
    .legend { font-size: 14px; fill: #5f5f5f; }
  </style>

  <defs>
    <marker id="arrowclaude" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#5a5a5a"/>
    </marker>
    <filter id="shadow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1800" height="1200" fill="#f8f6f3"/>

  <text x="120" y="92" class="title">Human-in-the-Loop (HITL) 的数字员工运营飞轮</text>
  <text x="120" y="126" class="subtitle">围绕大 POI 核实场景，用人工反馈结果池持续驱动核实 Skill 与质检 Skill 的分析、迭代、联合回归与发布决策</text>

  <g opacity="0.95">
    <path d="M530 318 C760 168, 1042 170, 1270 318" fill="none" stroke="#5a5a5a" stroke-width="5" marker-end="url(#arrowclaude)"/>
    <path d="M1318 392 C1468 550, 1496 754, 1382 920" fill="none" stroke="#5a5a5a" stroke-width="5" marker-end="url(#arrowclaude)"/>
    <path d="M1232 992 C1034 1084, 770 1082, 570 988" fill="none" stroke="#5a5a5a" stroke-width="5" marker-end="url(#arrowclaude)"/>
    <path d="M436 918 C320 752, 344 546, 486 384" fill="none" stroke="#5a5a5a" stroke-width="5" marker-end="url(#arrowclaude)"/>
  </g>

  <g filter="url(#shadow-soft)">
    <circle cx="900" cy="662" r="286" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="3"/>
    <circle cx="900" cy="662" r="212" fill="#f8f6f3" stroke="#4a4a4a" stroke-width="2.5"/>
    <rect x="836" y="524" width="128" height="128" rx="24" ry="24" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5"/>
    <path d="M874 588h52M900 562v52" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
    <text x="900" y="708" text-anchor="middle" class="eyebrow">HITL CORE</text>
    <text x="900" y="754" text-anchor="middle" class="center-title">数字员工迭代分析引擎</text>
    <text x="900" y="790" text-anchor="middle" class="center-body">基于人工反馈结果池与历史执行日志，</text>
    <text x="900" y="818" text-anchor="middle" class="center-body">按迭代批次分别输出核实 / 质检两套 Skill 的问题诊断与迭代建议</text>
    <rect x="700" y="852" width="400" height="46" rx="23" ry="23" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2"/>
    <text x="900" y="881" text-anchor="middle" class="tag">共享输入，双 Skill 并行升级，统一发布结论</text>
  </g>

  <g filter="url(#shadow-soft)">
    <rect x="138" y="238" width="404" height="178" rx="24" ry="24" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="176" y="286" class="eyebrow">STEP 01</text>
    <text x="176" y="334" class="card-title">人工反馈结果池</text>
    <text x="176" y="372" class="card-body">汇总一段时间内人工核实 / 复核后的真实结果，</text>
    <text x="176" y="400" class="card-body">作为本轮迭代的上游基准输入。</text>
    <text x="176" y="440" class="legend">不与数字员工任务执行批次一一绑定</text>
  </g>

  <g filter="url(#shadow-soft)">
    <rect x="1258" y="238" width="404" height="178" rx="24" ry="24" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="1296" y="286" class="eyebrow">STEP 02</text>
    <text x="1296" y="334" class="card-title">迭代批次</text>
    <text x="1296" y="372" class="card-body">把同一时间窗内的人工反馈与历史日志</text>
    <text x="1296" y="400" class="card-body">组织成一次可分析、可升级、可发布的迭代单元。</text>
    <text x="1296" y="440" class="legend">分析批次 = 版本迭代周期</text>
  </g>

  <g filter="url(#shadow-soft)">
    <rect x="118" y="846" width="478" height="216" rx="28" ry="28" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="160" y="896" class="eyebrow">STEP 03A</text>
    <text x="160" y="944" class="card-title">核实 Skill 分析与迭代</text>
    <text x="160" y="982" class="card-body">LLM 结合人工误差、日志归因、执行异常与边界样本，</text>
    <text x="160" y="1010" class="card-body">输出核实问题清单、迭代建议与候选版本。</text>
    <text x="160" y="1050" class="legend">产物：核实问题 / 核实建议 / 核实候选版本</text>
  </g>

  <g filter="url(#shadow-soft)">
    <rect x="1204" y="846" width="478" height="216" rx="28" ry="28" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="1246" y="896" class="eyebrow">STEP 03B</text>
    <text x="1246" y="944" class="card-title">质检 Skill 分析与迭代</text>
    <text x="1246" y="982" class="card-body">LLM 分析质检误判、漏判、规则不稳定与解释不足，</text>
    <text x="1246" y="1010" class="card-body">输出质检问题清单、迭代建议与候选版本。</text>
    <text x="1246" y="1050" class="legend">产物：质检问题 / 质检建议 / 质检候选版本</text>
  </g>

  <g filter="url(#shadow-soft)">
    <rect x="592" y="944" width="616" height="198" rx="28" ry="28" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="636" y="994" class="eyebrow">STEP 04</text>
    <text x="636" y="1042" class="card-title">联合回归验证与发布结论</text>
    <text x="636" y="1080" class="card-body">同一次回归样本集同时验证核实 Skill 与质检 Skill 新版本，</text>
    <text x="636" y="1108" class="card-body">分别输出“核实是否通过 / 质检是否通过”，再收敛为统一上线、暂缓或回滚结论。</text>
  </g>

  <g filter="url(#shadow-soft)">
    <rect x="682" y="182" width="436" height="92" rx="22" ry="22" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2"/>
    <text x="900" y="220" text-anchor="middle" class="eyebrow">OPERATING PRINCIPLE</text>
    <text x="900" y="252" text-anchor="middle" class="legend">同一人工反馈基准，分别驱动核实 / 质检两套 Skill 升级；通过联合回归守住整体发布质量</text>
  </g>

  <g filter="url(#shadow-soft)">
    <rect x="120" y="584" width="270" height="134" rx="22" ry="22" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2"/>
    <text x="156" y="624" class="eyebrow">WHY IT MATTERS</text>
    <text x="156" y="666" class="legend">人工结果不是终点，</text>
    <text x="156" y="694" class="legend">而是反向驱动数字员工持续变好的燃料。</text>
  </g>

  <g filter="url(#shadow-soft)">
    <rect x="1418" y="586" width="272" height="150" rx="22" ry="22" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2"/>
    <text x="1454" y="626" class="eyebrow">KEY OUTPUTS</text>
    <text x="1454" y="668" class="legend">1. 核实 Skill 是否通过回归</text>
    <text x="1454" y="698" class="legend">2. 质检 Skill 是否通过回归</text>
    <text x="1454" y="728" class="legend">3. 本轮整体是否允许上线</text>
  </g>
</svg>
